<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Your Data</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#EAF0EE;--panel:#FFFFFF;--ink:#12302B;--muted:#5B7570;--line:#CFDCD8;--accent:#1F7A8C;--accent-ink:#FFFFFF;--side:#12302B;--side-ink:#DCEBE7;--err:#B3261E;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:24px 20px}
aside h1{font-size:20px;margin:0 0 4px;font-weight:600}
aside p{margin:0 0 20px;font-size:13px;opacity:.75}
aside h2{font-size:14px;font-weight:600;margin:20px 0 8px}
.tbl{font-family:var(--mono);font-size:12px;margin-bottom:10px}
.tbl b{color:#fff;font-weight:500}
.tbl span{display:block;opacity:.7;padding-left:10px}
main{padding:24px;max-width:900px;width:100%}
.ask{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding-bottom:12px;z-index:2}
.ask input{flex:1;font:inherit;padding:14px 16px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.ask input:focus,.chip:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.ask button{font:inherit;font-weight:600;padding:0 22px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.ask button:disabled{opacity:.6;cursor:wait}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.turn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.turn h3{margin:0 0 4px;font-size:17px}
.turn .why{margin:0 0 12px;color:var(--muted);font-size:14px}
.turn.error{border-color:var(--err)}
.turn.error .why{color:var(--err);margin:0}
details{margin:0 0 12px}
summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500}
pre{margin:8px 0 0;padding:12px;background:#F3F7F6;border-radius:6px;font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.chart{position:relative;height:280px;margin-bottom:14px}
.scroll{overflow-x:auto;max-height:320px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#F3F7F6;font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--muted);margin-top:8px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{padding:16px}main{padding:16px}.schema{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Ask Your Data</h1>
    <p>Type a question in English. The AI writes the SQL, runs it safely, and shows the answer.</p>
    <div class="schema"><h2>Tables you can ask about</h2><div id="schema"></div></div>
  </aside>
  <main>
    <form class="ask" id="form">
      <input id="q" placeholder="e.g. Which city spends the most?" aria-label="Your question" maxlength="300" autocomplete="off">
      <button id="go" type="submit">Ask</button>
    </form>
    <div class="chips" id="chips"></div>
    <div id="feed"><div class="empty" id="empty">Pick an example above or type your own question.</div></div>
  </main>
</div>
<script>
const EXAMPLES=["Top 5 products by revenue","Revenue by month","How many orders per city?","Revenue share by category","Which customers placed the most orders?"];
const $=id=>document.getElementById(id);
const history=[];let charts=[];

$("chips").innerHTML=EXAMPLES.map(e=>`<button class="chip" type="button">${e}</button>`).join("");
$("chips").addEventListener("click",e=>{if(e.target.classList.contains("chip")){$("q").value=e.target.textContent;$("form").requestSubmit();}});

fetch("/api/schema").then(r=>r.json()).then(s=>{
  $("schema").innerHTML=Object.entries(s).map(([t,c])=>`<div class="tbl"><b>${t}</b>${c.map(x=>`<span>${x}</span>`).join("")}</div>`).join("");
}).catch(()=>{});

function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}

function renderTable(cols,rows){
  const wrap=el("div","scroll"),t=el("table"),h=el("tr");
  cols.forEach(c=>h.appendChild(el("th","",c)));t.appendChild(h);
  rows.forEach(r=>{const tr=el("tr");r.forEach(v=>{const isNum=typeof v==="number";
    tr.appendChild(el("td",isNum?"num":"",isNum?v.toLocaleString("en-IN"):(v??"")));});t.appendChild(tr);});
  wrap.appendChild(t);return wrap;
}

function renderChart(kind,cols,rows){
  if(kind==="none"||cols.length<2||rows.length<2||rows.length>40)return null;
  const vi=cols.findIndex((c,i)=>i>0&&rows.every(r=>typeof r[i]==="number"));
  if(vi<1)return null;
  const box=el("div","chart"),cv=document.createElement("canvas");box.appendChild(cv);
  const palette=["#1F7A8C","#E0A458","#5B8E7D","#BC4B51","#8B7FB5","#3D5A80","#98C1D9","#6B705C"];
  const labels=rows.map(r=>String(r[0])),data=rows.map(r=>r[vi]);
  const isPie=kind==="pie";
  setTimeout(()=>{charts.push(new Chart(cv,{type:isPie?"doughnut":kind,
    data:{labels,datasets:[{label:cols[vi],data,backgroundColor:isPie?labels.map((_,i)=>palette[i%palette.length]):"#1F7A8C",borderColor:"#1F7A8C",borderWidth:kind==="line"?2:0,tension:.25,pointRadius:kind==="line"?2:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:isPie,position:"right"}},scales:isPie?{}:{y:{beginAtZero:true}}}}));},0);
  return box;
}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("q").value.trim();if(q.length<3)return;
  $("go").disabled=true;$("go").textContent="Thinking…";
  const empty=$("empty");if(empty)empty.remove();
  const card=el("div","turn");$("feed").prepend(card);
  card.appendChild(el("h3","",q));
  try{
    const res=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,history})});
    const d=await res.json();
    if(!res.ok){card.classList.add("error");card.appendChild(el("p","why",d.detail||"Something went wrong."));return;}
    history.push(q);
    card.appendChild(el("p","why",d.explanation));
    if(d.sql){
      const det=el("details"),sum=el("summary","","Show the SQL"),pre=el("pre","",d.sql);
      det.append(sum,pre);card.appendChild(det);
      const ch=renderChart(d.chart,d.columns,d.rows);if(ch)card.appendChild(ch);
      card.appendChild(renderTable(d.columns,d.rows));
      card.appendChild(el("p","meta",`${d.rows.length} row${d.rows.length===1?"":"s"} · read-only query${d.mode==="demo"?" · demo mode (no API key)":""}`));
    }
    $("q").value="";
  }catch(err){card.classList.add("error");card.appendChild(el("p","why","Could not reach the server. Is it running?"));}
  finally{$("go").disabled=false;$("go").textContent="Ask";}
});
</script>
</body>
</html>
